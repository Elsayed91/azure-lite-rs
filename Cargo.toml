[package]
name = "azure-lite-rs"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Lightweight HTTP client for Azure APIs"
repository = "https://github.com/Elsayed91/azure-lite-rs"
documentation = "https://docs.rs/azure-lite-rs"
keywords = ["azure", "cloud"]
categories = ["api-bindings"]

[dependencies]
cloud-lite-core = { package = "cloud-lite-core-rs", version = "0.1", path = "../cloud-lite-core" }
bytes = "1"
reqwest = { version = "0.13", features = ["rustls", "json", "form"], default-features = false }
tokio = { version = "1", features = ["time", "sync", "process"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
urlencoding = "2.1"
async-stream = "0.3"
futures-core = "0.3"

[features]
test-support = []

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"

[profile.dev]
debug = "line-tables-only"
split-debuginfo = "unpacked"

[profile.dev.package."*"]
opt-level = 0
debug = 0
