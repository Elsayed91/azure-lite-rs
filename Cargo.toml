[package]
name = "azure-lite"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Lightweight HTTP client for Azure APIs"

[dependencies]
cloud-lite-core = "0.1.0"
bytes = "1"
reqwest = { version = "0.13", features = ["rustls", "json", "form"], default-features = false }
tokio = { version = "1", features = ["time", "sync", "process"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
urlencoding = "2.1"
async-stream = "0.3"
futures-core = "0.3"

[features]
test-support = []

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
