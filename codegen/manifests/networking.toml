# ============================================================================
# VNet Operations
# ============================================================================

[[operations]]
name = "ListVNets"
rust_name = "list_vnets"
method = "GET"
url_template = "/subscriptions/{subscriptionId}/resourceGroups/{resourceGroupName}/providers/Microsoft.Network/virtualNetworks"
response_type = "VirtualNetworkListResult"
description = "Gets all virtual networks in a resource group."

[[operations]]
name = "ListVNetsAll"
rust_name = "list_vnets_all"
method = "GET"
url_template = "/subscriptions/{subscriptionId}/providers/Microsoft.Network/virtualNetworks"
response_type = "VirtualNetworkListResult"
description = "Gets all virtual networks in a subscription."

[[operations]]
name = "GetVNet"
rust_name = "get_vnet"
method = "GET"
url_template = "/subscriptions/{subscriptionId}/resourceGroups/{resourceGroupName}/providers/Microsoft.Network/virtualNetworks/{virtualNetworkName}"
response_type = "VirtualNetwork"
description = "Gets the specified virtual network by resource group."

[[operations.query_params]]
name = "$expand"
rust_name = "expand"
description = "Expands referenced resources"

[[operations]]
name = "CreateVNet"
rust_name = "create_vnet"
method = "PUT"
url_template = "/subscriptions/{subscriptionId}/resourceGroups/{resourceGroupName}/providers/Microsoft.Network/virtualNetworks/{virtualNetworkName}"
request_body_type = "VirtualNetworkCreateRequest"
response_type = "VirtualNetwork"
description = "Creates or updates a virtual network in the specified resource group."

[[operations]]
name = "DeleteVNet"
rust_name = "delete_vnet"
method = "DELETE"
url_template = "/subscriptions/{subscriptionId}/resourceGroups/{resourceGroupName}/providers/Microsoft.Network/virtualNetworks/{virtualNetworkName}"
description = "Deletes the specified virtual network."

[[operations]]
name = "ListSubnets"
rust_name = "list_subnets"
method = "GET"
url_template = "/subscriptions/{subscriptionId}/resourceGroups/{resourceGroupName}/providers/Microsoft.Network/virtualNetworks/{virtualNetworkName}/subnets"
response_type = "SubnetListResult"
description = "Gets all subnets in a virtual network."

[[operations]]
name = "GetSubnet"
rust_name = "get_subnet"
method = "GET"
url_template = "/subscriptions/{subscriptionId}/resourceGroups/{resourceGroupName}/providers/Microsoft.Network/virtualNetworks/{virtualNetworkName}/subnets/{subnetName}"
response_type = "Subnet"
description = "Gets the specified subnet by virtual network and resource group."

[[operations.query_params]]
name = "$expand"
rust_name = "expand"
description = "Expands referenced resources"

