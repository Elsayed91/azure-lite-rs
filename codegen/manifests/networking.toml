# Azure Networking API manifest
# ARM REST API version: 2024-01-01
# Source: https://learn.microsoft.com/en-us/rest/api/virtualnetwork/

[api]
name = "networking"
display_name = "Azure Networking"
version = "v1"
api_version = "2024-01-01"
service_name = "networking"
wire_format = "azure_rest_json"
base_url = "https://management.azure.com"
doc_url = "https://learn.microsoft.com/en-us/rest/api/virtualnetwork/"

[api.client]
accessor_name = "networking"
client_struct = "NetworkingClient"

