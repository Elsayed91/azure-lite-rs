description = "Rules governing the accessibility of the key vault from specific network locations"

[[types.fields]]
name = "publicNetworkAccess"
type = "string"
description = "Property to specify whether the vault will accept traffic from public internet (Enabled or Disabled)"

[[types.fields]]
name = "provisioningState"
