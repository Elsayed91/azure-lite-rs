# Azure Key Vault API manifest
# ARM management plane: api-version 2023-07-01
# Source: https://learn.microsoft.com/en-us/rest/api/keyvault/
#
# NOTE: WrapKey and UnwrapKey are cryptographic data-plane operations that
# require the vault-scoped endpoint (https://{vault}.vault.azure.net) and
# a different auth scope. They are NOT included here and must be implemented
# as custom hand-written methods in api/keyvault.rs if needed.

[api]
name = "keyvault"
display_name = "Azure Key Vault"
version = "v1"
api_version = "2023-07-01"
service_name = "keyvault"
wire_format = "azure_rest_json"
base_url = "https://management.azure.com"
doc_url = "https://learn.microsoft.com/en-us/rest/api/keyvault/"

[api.client]
accessor_name = "keyvault"
client_struct = "KeyVaultClient"

# ============================================================================
# Vault Types
# ============================================================================

# --- VaultSku ---
[[types]]
name = "VaultSku"
description = "SKU details for a Key Vault."

[[types.fields]]
name = "family"
type = "string"
description = "SKU family name (e.g., 'A')"

[[types.fields]]
name = "name"
type = "string"
description = "SKU name (Standard or Premium)"

# --- AccessPolicyEntry ---
[[types]]
name = "AccessPolicyEntry"
description = "An identity that has access to the key vault."

[[types.fields]]
name = "tenantId"
type = "string"
description = "The Azure Active Directory tenant ID"

[[types.fields]]
name = "objectId"
type = "string"
description = "The object ID of the user, service principal, or security group"

[[types.fields]]
name = "permissions"
rust_type = "AccessPermissions"
description = "Permissions the identity has for keys, secrets, and certificates"

# --- AccessPermissions ---
[[types]]
name = "AccessPermissions"
description = "Permissions the identity has for keys, secrets, and certificates."

[[types.fields]]
name = "keys"
rust_type = "Vec<String>"
description = "Permissions to keys"

[[types.fields]]
name = "secrets"
rust_type = "Vec<String>"
description = "Permissions to secrets"

[[types.fields]]
name = "certificates"
rust_type = "Vec<String>"
description = "Permissions to certificates"

[[types.fields]]
name = "storage"
rust_type = "Vec<String>"
description = "Permissions to storage accounts"

# --- IpRule ---
[[types]]
name = "IpRule"
description = "A rule governing the accessibility from a specific IP address or IP range."

[[types.fields]]
name = "value"
type = "string"
description = "IPv4 address range in CIDR notation (e.g., '124.56.78.91' or '124.56.78.0/24')"

# --- VirtualNetworkRule ---
[[types]]
name = "VirtualNetworkRule"
description = "A rule governing the accessibility from a specific virtual network."

[[types.fields]]
name = "id"
type = "string"
description = "Resource ID of a subnet (e.g., '/subscriptions/.../subnets/subnet1')"

[[types.fields]]
name = "ignoreMissingVnetServiceEndpoint"
type = "boolean"
description = "Property to specify whether NRP will ignore the check if parent subnet has serviceEndpoints configured"

# --- NetworkRuleSet ---
[[types]]
name = "NetworkRuleSet"
description = "A set of rules governing the network accessibility of a vault."

[[types.fields]]
name = "bypass"
type = "string"
description = "Specifies which traffic can bypass network rules (AzureServices or None)"

[[types.fields]]
name = "defaultAction"
type = "string"
description = "The default action when no rule matches (Allow or Deny)"

[[types.fields]]
name = "ipRules"
rust_type = "Vec<IpRule>"
description = "The list of IP address rules"

[[types.fields]]
name = "virtualNetworkRules"
rust_type = "Vec<VirtualNetworkRule>"
description = "The list of virtual network rules"

# --- VaultProperties ---
[[types]]
name = "VaultProperties"
description = "Properties of the vault."

[[types.fields]]
name = "tenantId"
type = "string"
description = "The Azure Active Directory tenant ID"

[[types.fields]]
name = "sku"
rust_type = "VaultSku"
description = "SKU details"

[[types.fields]]
name = "accessPolicies"
rust_type = "Vec<AccessPolicyEntry>"
description = "An array of 0 to 1024 identities that have access to the key vault"

[[types.fields]]
name = "vaultUri"
type = "string"
description = "The URI of the vault for performing operations on keys and secrets"

[[types.fields]]
name = "enabledForDeployment"
type = "boolean"
description = "Property to specify whether Azure VMs can retrieve certificates stored as secrets"

[[types.fields]]
name = "enabledForTemplateDeployment"
type = "boolean"
description = "Property to specify whether Azure Resource Manager is permitted to retrieve secrets"

[[types.fields]]
name = "enableSoftDelete"
