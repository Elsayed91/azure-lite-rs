# ============================================================================
# Vault Operations
# ============================================================================

[[operations]]
name = "ListVaults"
rust_name = "list_vaults"
method = "GET"
url_template = "/subscriptions/{subscriptionId}/providers/Microsoft.KeyVault/vaults"
response_type = "VaultListResult"
description = "The List operation gets information about the vaults associated with the subscription."

[[operations]]
name = "ListVaultsInGroup"
rust_name = "list_vaults_in_group"
method = "GET"
url_template = "/subscriptions/{subscriptionId}/resourceGroups/{resourceGroupName}/providers/Microsoft.KeyVault/vaults"
response_type = "VaultListResult"
description = "The List operation gets information about the vaults associated with the subscription and within the specified resource group."

[[operations]]
name = "GetVault"
rust_name = "get_vault"
method = "GET"
url_template = "/subscriptions/{subscriptionId}/resourceGroups/{resourceGroupName}/providers/Microsoft.KeyVault/vaults/{vaultName}"
response_type = "Vault"
description = "Gets the specified Azure key vault."

[[operations]]
name = "CreateVault"
rust_name = "create_vault"
method = "PUT"
url_template = "/subscriptions/{subscriptionId}/resourceGroups/{resourceGroupName}/providers/Microsoft.KeyVault/vaults/{vaultName}"
request_body_type = "VaultCreateRequest"
response_type = "Vault"
description = "Create or update a key vault in the specified subscription."

[[operations]]
name = "DeleteVault"
rust_name = "delete_vault"
method = "DELETE"
url_template = "/subscriptions/{subscriptionId}/resourceGroups/{resourceGroupName}/providers/Microsoft.KeyVault/vaults/{vaultName}"
description = "Deletes the specified Azure key vault."

# ============================================================================
# Secret Operations (ARM management plane — no secret values in list responses)
# ============================================================================

[[operations]]
name = "ListSecrets"
rust_name = "list_secrets"
method = "GET"
url_template = "/subscriptions/{subscriptionId}/resourceGroups/{resourceGroupName}/providers/Microsoft.KeyVault/vaults/{vaultName}/secrets"
response_type = "SecretListResult"
description = "The List operation gets information about the secrets in a vault. NOTE: This operation does not return secret values."

[[operations]]
name = "GetSecret"
rust_name = "get_secret"
method = "GET"
url_template = "/subscriptions/{subscriptionId}/resourceGroups/{resourceGroupName}/providers/Microsoft.KeyVault/vaults/{vaultName}/secrets/{secretName}"
response_type = "Secret"
description = "Gets the specified secret. NOTE: This operation does not return the secret value."

[[operations]]
name = "SetSecret"
rust_name = "set_secret"
method = "PUT"
url_template = "/subscriptions/{subscriptionId}/resourceGroups/{resourceGroupName}/providers/Microsoft.KeyVault/vaults/{vaultName}/secrets/{secretName}"
request_body_type = "SecretCreateRequest"
response_type = "Secret"
description = "Create or update a secret in a key vault in the specified subscription."

# NOTE: DeleteSecret is not available via the ARM management plane (returns 405).
# Use the Key Vault data plane API (https://{vault}.vault.azure.net) to delete secrets.

# ============================================================================
# Key Operations (ARM management plane)
# ============================================================================

[[operations]]
name = "ListKeys"
rust_name = "list_keys"
method = "GET"
url_template = "/subscriptions/{subscriptionId}/resourceGroups/{resourceGroupName}/providers/Microsoft.KeyVault/vaults/{vaultName}/keys"
response_type = "KeyListResult"
description = "Lists the keys in the specified key vault."

[[operations]]
name = "GetKey"
rust_name = "get_key"
method = "GET"
url_template = "/subscriptions/{subscriptionId}/resourceGroups/{resourceGroupName}/providers/Microsoft.KeyVault/vaults/{vaultName}/keys/{keyName}"
response_type = "Key"
description = "Gets the current version of the specified key from the specified key vault."

[[operations]]
name = "CreateKey"
rust_name = "create_key"
method = "PUT"
url_template = "/subscriptions/{subscriptionId}/resourceGroups/{resourceGroupName}/providers/Microsoft.KeyVault/vaults/{vaultName}/keys/{keyName}"
request_body_type = "KeyCreateRequest"
response_type = "Key"
description = "Creates the first version of a new key if it does not exist. If it already exists, then the existing key is returned without any write operations being performed."

# NOTE: DeleteKey is not available via the ARM management plane (returns 405).
# Use the Key Vault data plane API (https://{vault}.vault.azure.net) to delete keys.
