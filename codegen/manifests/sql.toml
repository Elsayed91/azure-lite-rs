# Azure SQL API manifest
# ARM REST API version: 2023-08-01-preview
# Source: https://learn.microsoft.com/en-us/rest/api/sql/

[api]
name = "sql"
display_name = "Azure SQL"
version = "v1"
api_version = "2023-08-01-preview"
service_name = "sql"
wire_format = "azure_rest_json"
base_url = "https://management.azure.com"
doc_url = "https://learn.microsoft.com/en-us/rest/api/sql/"

[api.client]
accessor_name = "sql"
client_struct = "SqlClient"

# ============================================================================
# Server Types
# ============================================================================

# --- ServerProperties ---
[[types]]
name = "ServerProperties"
description = "The properties of a server."

[[types.fields]]
name = "administratorLogin"
type = "string"
description = "Administrator username for the server"

[[types.fields]]
name = "fullyQualifiedDomainName"
type = "string"
description = "The fully qualified domain name of the server"

[[types.fields]]
name = "state"
type = "string"
description = "The state of the server (Ready, Disabled, etc.)"

[[types.fields]]
name = "version"
type = "string"
description = "The version of the server"

# --- Server ---
[[types]]
name = "Server"
description = "An Azure SQL Database server."

[[types.fields]]
name = "id"
type = "string"
description = "Fully qualified resource ID"

[[types.fields]]
name = "name"
type = "string"
description = "The name of the resource"

[[types.fields]]
name = "type"
type = "string"
