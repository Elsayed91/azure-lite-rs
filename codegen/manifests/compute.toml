# Azure Compute API manifest
# ARM REST API version: 2024-07-01 (valid for both Managed Disks and VMs)
# Note: 2024-03-02 was a valid disk-only version; 2024-07-01 covers both.
# Source: https://learn.microsoft.com/en-us/rest/api/compute/virtual-machines

[api]
name = "compute"
display_name = "Azure Compute"
version = "v1"
api_version = "2024-07-01"
service_name = "compute"
wire_format = "azure_rest_json"
base_url = "https://management.azure.com"
doc_url = "https://learn.microsoft.com/en-us/rest/api/compute/"

[api.client]
accessor_name = "compute"
client_struct = "ComputeClient"

