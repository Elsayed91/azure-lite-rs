# ============================================================================
# Operations
# ============================================================================

[[operations]]
name = "ListVMs"
rust_name = "list_vms"
method = "GET"
url_template = "/subscriptions/{subscriptionId}/resourceGroups/{resourceGroupName}/providers/Microsoft.Compute/virtualMachines"
response_type = "VirtualMachineListResult"
description = "List virtual machines in a resource group."

[[operations]]
name = "GetVM"
rust_name = "get_vm"
method = "GET"
url_template = "/subscriptions/{subscriptionId}/resourceGroups/{resourceGroupName}/providers/Microsoft.Compute/virtualMachines/{vmName}"
response_type = "VirtualMachine"
description = "Get a virtual machine."

[[operations.query_params]]
name = "$expand"
rust_name = "expand"
description = "Expand expression (e.g. instanceView)"

[[operations]]
name = "CreateVM"
rust_name = "create_vm"
method = "PUT"
url_template = "/subscriptions/{subscriptionId}/resourceGroups/{resourceGroupName}/providers/Microsoft.Compute/virtualMachines/{vmName}"
request_body_type = "VirtualMachineCreateRequest"
response_type = "VirtualMachine"
description = "Create or update a virtual machine."

[[operations]]
name = "DeleteVM"
rust_name = "delete_vm"
method = "DELETE"
url_template = "/subscriptions/{subscriptionId}/resourceGroups/{resourceGroupName}/providers/Microsoft.Compute/virtualMachines/{vmName}"
description = "Delete a virtual machine."

[[operations]]
name = "StartVM"
rust_name = "start_vm"
method = "POST"
url_template = "/subscriptions/{subscriptionId}/resourceGroups/{resourceGroupName}/providers/Microsoft.Compute/virtualMachines/{vmName}/start"
description = "Start a virtual machine."

[[operations]]
name = "StopVM"
rust_name = "stop_vm"
method = "POST"
url_template = "/subscriptions/{subscriptionId}/resourceGroups/{resourceGroupName}/providers/Microsoft.Compute/virtualMachines/{vmName}/powerOff"
description = "Power off (stop) a virtual machine. The VM continues to be billed."

[[operations]]
name = "DeallocateVM"
rust_name = "deallocate_vm"
method = "POST"
url_template = "/subscriptions/{subscriptionId}/resourceGroups/{resourceGroupName}/providers/Microsoft.Compute/virtualMachines/{vmName}/deallocate"
description = "Deallocate a virtual machine. Stops billing."

[[operations]]
name = "RestartVM"
rust_name = "restart_vm"
method = "POST"
url_template = "/subscriptions/{subscriptionId}/resourceGroups/{resourceGroupName}/providers/Microsoft.Compute/virtualMachines/{vmName}/restart"
description = "Restart a virtual machine."

[[operations]]
name = "GetInstanceView"
rust_name = "get_instance_view"
method = "GET"
url_template = "/subscriptions/{subscriptionId}/resourceGroups/{resourceGroupName}/providers/Microsoft.Compute/virtualMachines/{vmName}/instanceView"
response_type = "VirtualMachineInstanceViewResult"
description = "Get the instance view of a virtual machine."

