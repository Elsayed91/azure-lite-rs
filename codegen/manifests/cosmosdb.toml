# Azure CosmosDB API manifest
# ARM REST API version: 2024-02-15-preview
# Source: https://learn.microsoft.com/en-us/rest/api/cosmos-db-resource-provider/

[api]
name = "cosmosdb"
display_name = "Azure CosmosDB"
version = "v1"
api_version = "2024-02-15-preview"
service_name = "cosmosdb"
wire_format = "azure_rest_json"
base_url = "https://management.azure.com"
doc_url = "https://learn.microsoft.com/en-us/rest/api/cosmos-db-resource-provider/"

[api.client]
accessor_name = "cosmosdb"
client_struct = "CosmosDbClient"

# ============================================================================
# Account Types
# ============================================================================

# --- ConsistencyPolicy ---
[[types]]
name = "ConsistencyPolicy"
description = "The consistency policy for the Cosmos DB account."

[[types.fields]]
name = "defaultConsistencyLevel"
type = "string"
required = true
description = "The default consistency level (BoundedStaleness, ConsistentPrefix, Eventual, Session, Strong)"

[[types.fields]]
name = "maxStalenessPrefix"
type = "int64"
description = "When used with BoundedStaleness, represents the number of stale requests tolerated"

[[types.fields]]
name = "maxIntervalInSeconds"
type = "integer"
description = "When used with BoundedStaleness, represents the time (seconds) of staleness tolerated"

# --- Location ---
[[types]]
name = "Location"
description = "A region in which the Azure Cosmos DB database account is deployed."

[[types.fields]]
name = "locationName"
type = "string"
description = "The name of the region"

[[types.fields]]
name = "provisioningState"
type = "string"
description = "The status of the Cosmos DB account at the time the operation was called"

[[types.fields]]
name = "failoverPriority"
type = "integer"
description = "The failover priority of the region (0 = write region)"

[[types.fields]]
name = "isZoneRedundant"
type = "boolean"
description = "Flag to indicate whether or not this region is an AvailabilityZone region"

# --- DatabaseAccountProperties ---
[[types]]
name = "DatabaseAccountProperties"
description = "Properties for the database account."

[[types.fields]]
name = "documentEndpoint"
type = "string"
description = "The connection endpoint for the Cosmos DB database account"

[[types.fields]]
name = "provisioningState"
type = "string"
description = "The status of the Cosmos DB account at the time the operation was called"

[[types.fields]]
name = "databaseAccountOfferType"
type = "string"
description = "The offer type for the Cosmos DB database account (Standard)"

[[types.fields]]
name = "consistencyPolicy"
rust_type = "ConsistencyPolicy"
description = "The consistency policy for the Cosmos DB account"

[[types.fields]]
name = "enableAutomaticFailover"
type = "boolean"
description = "Enables automatic failover of the write region"

[[types.fields]]
name = "enableMultipleWriteLocations"
type = "boolean"
description = "Enables the account to write in multiple locations"

# --- DatabaseAccount ---
[[types]]
name = "DatabaseAccount"
description = "An Azure Cosmos DB database account."

[[types.fields]]
name = "id"
type = "string"
description = "Fully qualified resource ID"

[[types.fields]]
name = "name"
type = "string"
description = "The name of the resource"

[[types.fields]]
name = "type"
type = "string"
serde_rename = "type"
description = "The type of the resource"

[[types.fields]]
name = "location"
type = "string"
description = "Resource location"

[[types.fields]]
name = "kind"
type = "string"
description = "Indicates the type of database account (GlobalDocumentDB, MongoDB, Parse)"

[[types.fields]]
name = "tags"
rust_type = "HashMap<String, String>"
description = "Resource tags"

[[types.fields]]
name = "properties"
rust_type = "DatabaseAccountProperties"
description = "Account properties"

# --- DatabaseAccountListResult ---
[[types]]
name = "DatabaseAccountListResult"
description = "The List operation response, that contains the database accounts and their properties."

[[types.fields]]
name = "value"
rust_type = "Vec<DatabaseAccount>"
description = "List of database account and their properties"

# --- DatabaseAccountCreateUpdateProperties ---
[[types]]
name = "DatabaseAccountCreateUpdateProperties"
description = "Properties to create and update Azure Cosmos DB database accounts."

[[types.fields]]
name = "databaseAccountOfferType"
type = "string"
required = true
description = "The offer type for the database (Standard)"

[[types.fields]]
name = "consistencyPolicy"
rust_type = "ConsistencyPolicy"
description = "The consistency policy for the Cosmos DB account"

[[types.fields]]
name = "enableAutomaticFailover"
type = "boolean"
description = "Enables automatic failover of the write region"

[[types.fields]]
name = "enableMultipleWriteLocations"
type = "boolean"
description = "Enables the account to write in multiple locations"

# --- DatabaseAccountCreateRequest ---
[[types]]
name = "DatabaseAccountCreateRequest"
description = "Parameters to create and update Cosmos DB database accounts."

[[types.fields]]
name = "location"
type = "string"
required = true
description = "The location of the resource group to which the resource belongs"

[[types.fields]]
name = "kind"
type = "string"
description = "Indicates the type of database account (GlobalDocumentDB, MongoDB, Parse)"

[[types.fields]]
name = "tags"
rust_type = "HashMap<String, String>"
description = "Resource tags"

[[types.fields]]
name = "properties"
rust_type = "DatabaseAccountCreateUpdateProperties"
required = true
description = "Properties for the database account"

