# ============================================================================
# Account Operations
# ============================================================================

[[operations]]
name = "ListAccounts"
rust_name = "list_accounts"
method = "GET"
url_template = "/subscriptions/{subscriptionId}/providers/Microsoft.DocumentDB/databaseAccounts"
response_type = "DatabaseAccountListResult"
description = "Lists all the Azure Cosmos DB database accounts available under the subscription."

[[operations]]
name = "GetAccount"
rust_name = "get_account"
method = "GET"
url_template = "/subscriptions/{subscriptionId}/resourceGroups/{resourceGroupName}/providers/Microsoft.DocumentDB/databaseAccounts/{accountName}"
response_type = "DatabaseAccount"
description = "Retrieves the properties of an existing Azure Cosmos DB database account."

[[operations]]
name = "CreateAccount"
rust_name = "create_account"
method = "PUT"
url_template = "/subscriptions/{subscriptionId}/resourceGroups/{resourceGroupName}/providers/Microsoft.DocumentDB/databaseAccounts/{accountName}"
request_body_type = "DatabaseAccountCreateRequest"
response_type = "DatabaseAccount"
description = "Creates or updates an Azure Cosmos DB database account."

[[operations]]
name = "DeleteAccount"
rust_name = "delete_account"
method = "DELETE"
url_template = "/subscriptions/{subscriptionId}/resourceGroups/{resourceGroupName}/providers/Microsoft.DocumentDB/databaseAccounts/{accountName}"
description = "Deletes an existing Azure Cosmos DB database account."

# ============================================================================
# SQL Database Operations
# ============================================================================

[[operations]]
name = "ListSqlDatabases"
rust_name = "list_sql_databases"
method = "GET"
url_template = "/subscriptions/{subscriptionId}/resourceGroups/{resourceGroupName}/providers/Microsoft.DocumentDB/databaseAccounts/{accountName}/sqlDatabases"
response_type = "SqlDatabaseListResult"
description = "Lists the SQL databases under an existing Azure Cosmos DB database account."

[[operations]]
name = "GetSqlDatabase"
rust_name = "get_sql_database"
method = "GET"
url_template = "/subscriptions/{subscriptionId}/resourceGroups/{resourceGroupName}/providers/Microsoft.DocumentDB/databaseAccounts/{accountName}/sqlDatabases/{databaseName}"
response_type = "SqlDatabaseGetResults"
description = "Gets the SQL database under an existing Azure Cosmos DB database account."

[[operations]]
name = "CreateSqlDatabase"
rust_name = "create_sql_database"
method = "PUT"
url_template = "/subscriptions/{subscriptionId}/resourceGroups/{resourceGroupName}/providers/Microsoft.DocumentDB/databaseAccounts/{accountName}/sqlDatabases/{databaseName}"
request_body_type = "SqlDatabaseCreateRequest"
response_type = "SqlDatabaseGetResults"
description = "Create or update an Azure Cosmos DB SQL database."

# ============================================================================
# SQL Container Operations
# ============================================================================

[[operations]]
name = "ListSqlContainers"
rust_name = "list_sql_containers"
method = "GET"
url_template = "/subscriptions/{subscriptionId}/resourceGroups/{resourceGroupName}/providers/Microsoft.DocumentDB/databaseAccounts/{accountName}/sqlDatabases/{databaseName}/containers"
response_type = "SqlContainerListResult"
description = "Lists the SQL container under an existing Azure Cosmos DB database account."

[[operations]]
name = "GetSqlContainer"
rust_name = "get_sql_container"
method = "GET"
url_template = "/subscriptions/{subscriptionId}/resourceGroups/{resourceGroupName}/providers/Microsoft.DocumentDB/databaseAccounts/{accountName}/sqlDatabases/{databaseName}/containers/{containerName}"
response_type = "SqlContainerGetResults"
description = "Gets the SQL container under an existing Azure Cosmos DB database account."
